name: build-binaries

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: aed-windows-x64
            ext: .exe
          - os: ubuntu-latest
            artifact: aed-linux-x86_64
            ext: ""
          - os: macos-latest
            artifact: aed-macos-arm64
            ext: ""
          - os: macos-13
            artifact: aed-macos-x86_64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file binary
        run: python build/build.py

      - name: Rename artifact
        shell: bash
        run: |
          mv "dist/aed${{ matrix.ext }}" "dist/${{ matrix.artifact }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}
          if-no-files-found: error
